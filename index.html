<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <style>
      /* The two bookmark photos are landscape compositions; preserve the full prints. */
      .work-section .project-card:nth-last-child(-n + 2) .project-image {
        height: auto;
        aspect-ratio: 1000 / 670;
        display: grid;
        place-items: center;
        background: #e9e7df;
      }
      /* Existing embedded bookmark images are only 400px wide. Never stretch them
         beyond native size while awaiting replacement with the full-size images. */
      .work-section .project-card:nth-last-child(-n + 2) .project-image img {
        width: min(100%, 400px);
        height: auto;
        object-fit: contain;
      }
      .work-section .project-card:nth-last-child(-n + 2):hover .project-image img {
        transform: none;
      }
      .modal-image.full-image > img:not(.modal-image-backdrop)[src^="data:image/webp;base64,"] {
        position: absolute;
        inset: 0;
        margin: auto;
        width: min(100%, 400px);
        height: auto;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
